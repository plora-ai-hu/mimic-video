# Dual SO-101 cable harnessing recording (/scratch/nk_plora/cable-harnessing-so101-2arm, 29 episodes).
defaults:
  - transform@_here_: so101_to_${policy_io}
  - _self_

data_components:
  scene_rgb:
    obs_type: ${ObsType:RGB}
    repr: null
  left_wrist_rgb:
    obs_type: ${ObsType:RGB}
    repr: null
  right_wrist_rgb:
    obs_type: ${ObsType:RGB}
    repr: null
  joint_state_lowdim:
    obs_type: ${ObsType:JOINT_POS}
    repr: ${LieRepr:ABSOLUTE}
  joint_action_lowdim:
    obs_type: ${ObsType:JOINT_POS}
    repr: ${LieRepr:ABSOLUTE}
  language_instruction:
    obs_type: ${ObsType:LANGUAGE}
    repr: null
  language_embedding:
    obs_type: ${ObsType:LANGUAGE_EMBEDDING}
    repr: null

dataset:
  _target_: cosmos_predict2.data.action.dataset_action.MimicDataset
  _convert_: partial
  data_dir: /scratch/nk_plora/mimic/cable-harnessing-so101-2arm/episodes
  timestep_anchor: scene_rgb
  data_components: ${..data_components}
  data_transforms: ${..data_transforms}
  source_component_names: ${..source_component_names}
  policy_io: ${policy_io.policy_io}
  should_include_padded_tails: True
  seed: 42
  num_val_episodes: 3
