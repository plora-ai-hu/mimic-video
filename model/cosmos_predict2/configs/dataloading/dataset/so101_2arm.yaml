# Dual SO-101 setup (no dataset yet, untested). Convert with so100/process_so100_v3.py using
#   --view <workspace cam>=scene_rgb --view <left wrist cam>=left_wrist_rgb --view <right wrist cam>=right_wrist_rgb
# and point data_dir at the output.
defaults:
  - transform@_here_: so101_to_${policy_io}
  - _self_

data_components:
  scene_rgb:
    obs_type: ${ObsType:RGB}
    repr: null
  left_wrist_rgb:
    obs_type: ${ObsType:RGB}
    repr: null
  right_wrist_rgb:
    obs_type: ${ObsType:RGB}
    repr: null
  joint_state_lowdim:
    obs_type: ${ObsType:JOINT_POS}
    repr: ${LieRepr:ABSOLUTE}
  joint_action_lowdim:
    obs_type: ${ObsType:JOINT_POS}
    repr: ${LieRepr:ABSOLUTE}
  language_instruction:
    obs_type: ${ObsType:LANGUAGE}
    repr: null
  language_embedding:
    obs_type: ${ObsType:LANGUAGE_EMBEDDING}
    repr: null

dataset:
  _target_: cosmos_predict2.data.action.dataset_action.MimicDataset
  _convert_: partial
  data_dir: /scratch/nk_plora/mimic/so101_2arm/episodes
  timestep_anchor: scene_rgb
  data_components: ${..data_components}
  data_transforms: ${..data_transforms}
  source_component_names: ${..source_component_names}
  policy_io: ${policy_io.policy_io}
  should_include_padded_tails: True
  seed: 42
  num_val_episodes: 10
