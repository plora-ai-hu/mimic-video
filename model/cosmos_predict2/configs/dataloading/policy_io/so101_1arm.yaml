# SO-101, one arm: workspace camera + one wrist camera, tiled into workspace_rgb by TileViews.
# Joint dimension is whatever the episodes store (6 for a single SO-101).
img_resize_sizes: [480, 640]

policy_io:
  action:
    scene_rgb:
      horizon: 56
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: 5
      shift_right_by: 0.2
    right_wrist_rgb:
      horizon: 56
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: 5
      shift_right_by: 0.2
    joint_action_lowdim:
      horizon: 15
      normalization_type: ${NormalizationType:VARIANCE}
      target_repr: ${LieRepr:ABSOLUTE}
      target_frequency: 5
      shift_right_by: 0.2
  obs:
    scene_rgb:
      horizon: 5
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: 5
      shift_right_by: 0
    right_wrist_rgb:
      horizon: 5
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: 5
      shift_right_by: 0
    joint_state_lowdim:
      horizon: 1
      normalization_type: ${NormalizationType:VARIANCE}
      target_repr: ${LieRepr:ABSOLUTE}
      target_frequency: 5
      shift_right_by: 0
    language_embedding:
      horizon: 1
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: null
      shift_right_by: 0


concat_groups:
  action/lowdim_concat:
    - action/joint_action_lowdim

  obs/lowdim_concat:
    - obs/joint_state_lowdim
