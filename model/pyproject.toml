[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos-predict2"
version = "1.0.9"
authors = [
  {name = "NVIDIA Corporation"},
]
description = "Cosmos World Foundation Model"
requires-python = "==3.10.*"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "attrs==25.1.0",
  "better-profanity==0.7.0",
  "boto3==1.38.31",
  "decord2",
  "diffusers==0.33.1",
  "einops==0.8.1",
  "ftfy==6.3.1",
  "fvcore==0.1.5.post20221221",
  "h11==0.16.0",
  "hydra-core==1.3.2",
  "imageio[pyav,ffmpeg]==2.37.0",
  "iopath==0.1.10",
  "ipdb==0.13.13",
  "loguru==0.7.3",
  "mediapy==1.2.4",
  "megatron-core==0.12.1",
  "modelscope==1.26.0",
  "nltk==3.9.1",
  "numpy==1.26.4",
  "nvidia-ml-py==12.535.133",
  "omegaconf==2.3.0",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "peft==0.15.2",
  "pillow==11.1.0",
  "protobuf==4.25.3",
  "pycocotools==2.0.10",
  "pynvml==12.0.0",
  "pyyaml==6.0.2",
  "qwen-vl-utils==0.0.11",
  "retinaface-py==0.0.2",
  "safetensors==0.8.0",
  "scikit-image==0.25.2",
  "sentencepiece==0.2.0",
  "setuptools==80.9.0",
  "termcolor==3.1.0",
  "threadpoolctl==3.6.0",
  "tqdm==4.66.5",
  "transformers==4.51.3",
  "tyro==1.0.8",
  "webdataset==0.2.111",
]

# this file has become a bit fucked up. we support x86 and arm for hopper (through cu126) and x86 for blackwell (through cu129).

[project.optional-dependencies]
cu126 = [
  "apex==0.1.0",
  "flash-attn==2.6.3",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformer-engine==1.13",
  "triton==3.2.0",
  # Torch dependencies
  # Dependencies determined from `uv pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cu126`
  # Issue: https://github.com/astral-sh/uv/issues/14237
  "nvidia-cublas-cu12==12.6.4.1; platform_machine == 'x86_64'",
  "nvidia-cuda-cupti-cu12==12.6.80; platform_machine == 'x86_64'",
  "nvidia-cuda-nvrtc-cu12==12.6.77; platform_machine == 'x86_64'",
  "nvidia-cuda-runtime-cu12==12.6.77; platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12==9.5.1.17; platform_machine == 'x86_64'",
  "nvidia-cufft-cu12==11.3.0.4; platform_machine == 'x86_64'",
  "nvidia-curand-cu12==10.3.7.77; platform_machine == 'x86_64'",
  "nvidia-cusolver-cu12==11.7.1.2; platform_machine == 'x86_64'",
  "nvidia-cusparse-cu12==12.5.4.2; platform_machine == 'x86_64'",
  "nvidia-cusparselt-cu12==0.6.3; platform_machine == 'x86_64'",
  "nvidia-nccl-cu12==2.21.5; platform_machine == 'x86_64'",
  "nvidia-nvjitlink-cu12==12.6.85; platform_machine == 'x86_64'",
  "nvidia-nvtx-cu12==12.6.77; platform_machine == 'x86_64'",
]

cu129 = [
  "nvidia-cudnn-cu12==9.10.2.21; platform_machine == 'x86_64'",
  "torch==2.8.0; platform_machine == 'x86_64'",
  "torchvision==0.23.0; platform_machine == 'x86_64'",
  "triton==3.4.0; platform_machine == 'x86_64'",
  "apex==0.1.0; platform_machine == 'x86_64'",
  "flash-attn==2.8.3+cu12torch2.8cxx11abiTRUE; platform_machine == 'x86_64'",
  "transformer-engine[pytorch]==1.13.0; platform_machine == 'x86_64'",
]

[project.readme]
content-type = "text/markdown"
text = '''
# Cosmos-Predict2

[Documentation](https://github.com/nvidia-cosmos/cosmos-predict2/blob/main/README.md)
'''

[project.urls]
documentation = "https://github.com/nvidia-cosmos/cosmos-predict2/blob/main/README.md"
homepage = "https://research.nvidia.com/labs/dir/cosmos-predict2"
issues = "https://github.com/nvidia-cosmos/cosmos-predict2/issues"
repository = "https://github.com/nvidia-cosmos/cosmos-predict2"

[tool.uv]
environments = [
  "python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]

required-environments = [
  "python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]

conflicts = [
  [
    { extra = "cu126" },
    { extra = "cu129" },
  ],
]

[tool.uv.sources]
apex = [
  { index = "cosmos-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { git = "https://github.com/NVIDIA/apex.git", extra = "cu126", marker = "platform_machine == 'aarch64'" },
  { git = "https://github.com/NVIDIA/apex.git", extra = "cu129", marker = "platform_machine == 'x86_64'" },
]
flash-attn = [
  { index = "cosmos-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.8cxx11abiTRUE-cp310-cp310-linux_x86_64.whl", extra = "cu129", marker = "platform_machine == 'x86_64'" },
]
transformer-engine = [
  { index = "cosmos-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { git = "https://github.com/NVIDIA/TransformerEngine.git", tag = "v1.13", extra = "cu126", marker = "platform_machine == 'aarch64'" },
]
triton = [
  { git = "https://github.com/triton-lang/triton.git", tag = "v3.2.0", subdirectory = "python", extra = "cu126", marker = "platform_machine == 'aarch64'" }
]
torch = [
  { index = "cosmos-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "platform_machine == 'aarch64'" },
  { index = "pytorch-cu129", extra = "cu129", marker = "platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "cosmos-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "platform_machine == 'aarch64'" },
  { index = "pytorch-cu129", extra = "cu129", marker = "platform_machine == 'x86_64'" },
]
nvidia-cudnn-cu12 = [
  { index = "pytorch-cu129", extra = "cu129", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "cosmos-cu126"
url = "https://nvidia-cosmos.github.io/cosmos-dependencies/cu126_torch260/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.extra-build-dependencies]
apex = [
  "setuptools",
  "torch==2.6.0+cu126; platform_machine == 'aarch64'",
  "torch @ https://download.pytorch.org/whl/cu129/torch-2.8.0%2Bcu129-cp310-cp310-manylinux_2_28_x86_64.whl; platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12==9.10.2.21; platform_machine == 'x86_64'"
]
flash-attn = [
  "setuptools",
  "ninja",
  "packaging",
  "torch==2.6.0+cu126; platform_machine == 'aarch64'",
  "torch @ https://download.pytorch.org/whl/cu129/torch-2.8.0%2Bcu129-cp310-cp310-manylinux_2_28_x86_64.whl; platform_machine == 'x86_64'",
]
transformer-engine = [
  "setuptools",
  "ninja",
  "cmake",
  "pybind11",
  "packaging",
  "torch==2.6.0+cu126; platform_machine == 'aarch64'",
  "torch @ https://download.pytorch.org/whl/cu129/torch-2.8.0%2Bcu129-cp310-cp310-manylinux_2_28_x86_64.whl; platform_machine == 'x86_64'",
  "pip",
  "numpy",
]
transformer-engine-torch = [
  "setuptools",
  "ninja",
  "cmake",
  "pybind11",
  "packaging",
  "wheel",
  "torch @ https://download.pytorch.org/whl/cu129/torch-2.8.0%2Bcu129-cp310-cp310-manylinux_2_28_x86_64.whl; platform_machine == 'x86_64'",
  "pip",
  "numpy",
]
triton = [
  "cmake",
  "ninja",
  "setuptools"
]

[tool.uv.extra-build-variables]
apex = { APEX_CPP_EXT = "1", APEX_CUDA_EXT = "1" }
transformer-engine = { NVTE_FRAMEWORK = "pytorch" }

[tool.hatch.build.targets.sdist]
packages = [
  "cosmos_predict2",
  "imaginaire",
]

[tool.hatch.build.targets.wheel]
packages = [
  "cosmos_predict2",
  "imaginaire",
]
exclude = [
  "*_test.py",
]

[tool.coverage.report]
include_namespace_packages = true
skip_empty = true
omit = [
  "tests/*",
  "legacy/*",
  ".venv/*",
  "**/test_*.py",
  "config.py",
  "config-3.10.py"
]

# Local: static metadata so uv can lock without building the cu129/aarch64 apex source
# variants (that build fails against this host's CUDA 13.2 nvcc). cu126 on x86_64 installs
# the prebuilt wheel from the cosmos-cu126 index regardless.
[[tool.uv.dependency-metadata]]
name = "apex"
version = "0.1.0"
requires-dist = []
